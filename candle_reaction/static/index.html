<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC 5m Candle Reaction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #0f172a; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useCallback } = React;

    const Play = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21 5,3"/></svg>
    );
    const Square = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
    );
    const TrendingUp = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23,6 13.5,15.5 8.5,10.5 1,18"/><polyline points="17,6 23,6 23,12"/></svg>
    );

    const Stat = ({ label, value, tone }) => (
      <div className="flex flex-col">
        <span className="text-[10px] uppercase tracking-wider text-slate-500">{label}</span>
        <span className={`text-lg font-semibold ${tone || 'text-white'}`}>{value}</span>
      </div>
    );

    const App = () => {
      const [s, setS] = useState(null);
      const [err, setErr] = useState(null);
      const [bt, setBt] = useState(null);
      const [btCandles, setBtCandles] = useState(6000);
      const [trades, setTrades] = useState([]);

      const refresh = useCallback(async () => {
        try {
          const r = await fetch('/api/candle/status');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          setS(await r.json());
          setErr(null);
        } catch (e) { setErr(String(e.message || e)); }
      }, []);

      const refreshBt = useCallback(async () => {
        try {
          const r = await fetch('/api/candle/backtest/status');
          if (r.ok) setBt(await r.json());
        } catch (e) { /* noop */ }
      }, []);

      const refreshTrades = useCallback(async () => {
        try {
          const r = await fetch('/api/candle/trades');
          if (r.ok) {
            const j = await r.json();
            setTrades(j.trades || []);
          }
        } catch (e) { /* noop */ }
      }, []);

      const setMode = async (contrarian) => {
        await fetch('/api/candle/mode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contrarian }),
        });
        refresh();
      };

      useEffect(() => {
        refresh(); refreshBt(); refreshTrades();
        const h = setInterval(() => { refresh(); refreshBt(); refreshTrades(); }, 5000);
        return () => clearInterval(h);
      }, [refresh, refreshBt, refreshTrades]);

      const toggle = async () => {
        const ep = s && s.running ? '/api/candle/stop' : '/api/candle/start';
        await fetch(ep, { method: 'POST' });
        refresh();
      };

      const runBacktest = async () => {
        await fetch('/api/candle/backtest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            candles: Number(btCandles) || 6000,
            contrarian: !!(s && s.mode === 'contrarian'),
          }),
        });
        refreshBt();
      };

      const running = !!(s && s.running);
      const wins = s?.wins ?? 0;
      const losses = s?.losses ?? 0;
      const voids = s?.voids ?? 0;
      const hitRate = s?.win_rate ?? 0;
      const pnl = s?.pnl ?? 0;
      const equity = s?.equity ?? (s?.bankroll ?? 0);
      const sig = s?.last_signal;
      const open = s?.open_trade;

      return (
        <div className="min-h-screen p-4 md:p-6">
          <div className="max-w-5xl mx-auto">
            <header className="mb-6">
              <h1 className="text-2xl md:text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                BTC 5m Candle Reaction
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Paper-trade the next 5m BTC candle from the just-closed candle's pressure + participation.
              </p>
            </header>

            <div className="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700/50 p-4">
              <div className="flex items-center justify-between mb-3 gap-3 flex-wrap">
                <div className="flex items-center gap-3">
                  <h2 className="text-lg font-semibold flex items-center gap-2">
                    <span className="text-cyan-400"><TrendingUp /></span>
                    Live engine
                  </h2>
                  <span className={`px-2 py-0.5 text-xs rounded border ${running ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-slate-700/40 text-slate-400 border-slate-600'}`}>
                    {running ? 'LIVE' : 'STOPPED'}
                  </span>
                  <div className="flex rounded-lg overflow-hidden border border-slate-700 text-xs">
                    <button onClick={() => setMode(false)}
                      className={`px-2 py-1 ${s && s.mode !== 'contrarian' ? 'bg-cyan-500/20 text-cyan-400' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                      Continuation
                    </button>
                    <button onClick={() => setMode(true)}
                      className={`px-2 py-1 ${s && s.mode === 'contrarian' ? 'bg-purple-500/20 text-purple-300' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                      Contrarian
                    </button>
                  </div>
                  {err && <span className="text-red-400 text-xs">{err}</span>}
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={toggle}
                    className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm border ${running ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-green-500/20 text-green-400 border-green-500/30'}`}>
                    {running ? <Square /> : <Play />} {running ? 'Stop' : 'Start'}
                  </button>
                  <a href="/api/candle/export?kind=trades"
                    className="px-3 py-1.5 rounded-lg text-sm border border-slate-600 text-slate-300 hover:bg-slate-700">
                    Export trades
                  </a>
                  <a href="/api/candle/export?kind=signals"
                    className="px-3 py-1.5 rounded-lg text-sm border border-slate-600 text-slate-300 hover:bg-slate-700">
                    Export signals
                  </a>
                </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-4">
                <Stat label="Wins" value={wins} tone="text-green-400" />
                <Stat label="Losses" value={losses} tone="text-red-400" />
                <Stat label="Voids" value={voids} tone="text-slate-400" />
                <Stat label="Hit rate" value={(hitRate * 100).toFixed(1) + '%'} />
                <Stat label="P&L"
                  value={(pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2)}
                  tone={pnl >= 0 ? 'text-green-400' : 'text-red-400'} />
                <Stat label="Equity" value={'$' + equity.toFixed(2)} />
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-slate-900/40 rounded-lg p-3 border border-slate-700/50">
                  <div className="text-[10px] uppercase tracking-wider text-slate-500 mb-2">Last signal</div>
                  {sig ? (
                    <div className="space-y-1 text-sm">
                      <div className="flex justify-between"><span className="text-slate-400">Side</span>
                        <span className={sig.side === 'UP' ? 'text-green-400' : 'text-red-400'}>{sig.side}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Confidence</span>
                        <span>{(sig.confidence * 100).toFixed(1)}%</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Stake</span>
                        <span>{sig.traded ? '$' + Number(sig.stake).toFixed(2) : 'skip'}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Close</span>
                        <span>${Number(sig.close_price).toFixed(2)}</span></div>
                      {sig.features && (
                        <div className="text-xs text-slate-500 mt-2">
                          cp={sig.features.close_position} body={sig.features.body_signed} volZ={sig.features.volume_z} streak={sig.features.streak}
                        </div>
                      )}
                    </div>
                  ) : <div className="text-sm text-slate-500">Waiting for first 5m close...</div>}
                </div>
                <div className="bg-slate-900/40 rounded-lg p-3 border border-slate-700/50">
                  <div className="text-[10px] uppercase tracking-wider text-slate-500 mb-2">Open trade</div>
                  {open ? (
                    <div className="space-y-1 text-sm">
                      <div className="flex justify-between"><span className="text-slate-400">Side</span>
                        <span className={open.side === 'UP' ? 'text-green-400' : 'text-red-400'}>{open.side}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Our q</span>
                        <span>{(open.confidence * 100).toFixed(1)}%</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Fill</span>
                        <span>{open.fill_price != null ? (open.fill_price * 100).toFixed(0) + '\u00a2' : '—'}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Edge</span>
                        <span className="text-cyan-400">{open.edge != null ? (open.edge * 100).toFixed(0) + '\u00a2' : '—'}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Stake</span>
                        <span>${Number(open.stake).toFixed(2)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Entry close</span>
                        <span>${Number(open.entry_close).toFixed(2)}</span></div>
                      {open.market_slug && (
                        <div className="text-[10px] text-slate-500 mt-1 break-all">{open.market_slug}</div>
                      )}
                    </div>
                  ) : <div className="text-sm text-slate-500">No open position.</div>}
                </div>
              </div>

              <div className="mt-4 bg-slate-900/40 rounded-lg p-3 border border-slate-700/50">
                <div className="flex items-center justify-between gap-3 flex-wrap mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] uppercase tracking-wider text-slate-500">Backtest</span>
                    {bt && (
                      <span className={`px-2 py-0.5 text-xs rounded border ${
                        bt.status === 'running' ? 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30' :
                        bt.status === 'done' ? 'bg-green-500/20 text-green-400 border-green-500/30' :
                        bt.status === 'failed' ? 'bg-red-500/20 text-red-400 border-red-500/30' :
                        'bg-slate-700/40 text-slate-400 border-slate-600'
                      }`}>{bt.status.toUpperCase()}</span>
                    )}
                    {bt && bt.status === 'failed' && bt.error && (
                      <span className="text-red-400 text-xs">{bt.error}</span>
                    )}
                  </div>
                  <div className="flex items-center gap-2">
                    <label className="text-xs text-slate-400">Candles</label>
                    <input type="number" min="100" max="20000" step="500"
                      value={btCandles} onChange={(e) => setBtCandles(e.target.value)}
                      disabled={bt && bt.status === 'running'}
                      className="w-24 px-2 py-1 rounded bg-slate-800 border border-slate-700 text-sm text-white disabled:opacity-50" />
                    <button onClick={runBacktest}
                      disabled={bt && bt.status === 'running'}
                      className="px-3 py-1.5 rounded-lg text-sm border border-cyan-500/30 bg-cyan-500/20 text-cyan-400 hover:bg-cyan-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
                      {bt && bt.status === 'running' ? 'Running...' : 'Run backtest'}
                    </button>
                    {bt && bt.status === 'done' && (
                      <a href="/api/candle/backtest/export"
                        className="px-3 py-1.5 rounded-lg text-sm border border-slate-600 text-slate-300 hover:bg-slate-700">
                        Download CSV
                      </a>
                    )}
                  </div>
                </div>
                {bt && bt.status === 'done' && bt.result && (
                  <div className="space-y-3">
                    <div className="grid grid-cols-2 md:grid-cols-6 gap-4">
                      <Stat label="Considered" value={bt.result.considered} />
                      <Stat label="Skipped" value={bt.result.skips} tone="text-slate-400" />
                      <Stat label="Wins" value={bt.result.wins} tone="text-green-400" />
                      <Stat label="Losses" value={bt.result.losses} tone="text-red-400" />
                      <Stat label="Hit rate" value={(bt.result.hit_rate * 100).toFixed(1) + '%'} />
                      <Stat label="P&L"
                        value={(bt.result.pnl >= 0 ? '+$' : '-$') + Math.abs(bt.result.pnl).toFixed(2)}
                        tone={bt.result.pnl >= 0 ? 'text-green-400' : 'text-red-400'} />
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs">
                        <thead>
                          <tr className="text-slate-500 uppercase tracking-wider">
                            <th className="text-left py-1">Bucket</th>
                            <th className="text-right py-1">Trades</th>
                            <th className="text-right py-1">Wins</th>
                            <th className="text-right py-1">Hit rate</th>
                          </tr>
                        </thead>
                        <tbody>
                          {['70-80','80-90','90-100'].map(k => {
                            const b = bt.result.buckets[k] || { n: 0, wins: 0, hit_rate: 0 };
                            return (
                              <tr key={k} className="border-t border-slate-700/50 text-slate-300">
                                <td className="py-1">{k}%</td>
                                <td className="text-right py-1">{b.n}</td>
                                <td className="text-right py-1">{b.wins}</td>
                                <td className="text-right py-1">{(b.hit_rate * 100).toFixed(1)}%</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
                {(!bt || bt.status === 'idle') && (
                  <div className="text-sm text-slate-500">No backtest run yet. Set candle count and hit Run.</div>
                )}
                {bt && bt.status === 'running' && (
                  <div className="text-sm text-slate-400">Fetching candles and replaying judge...</div>
                )}
              </div>
            </div>

            <div className="mt-6 bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700/50 p-4">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-lg font-semibold">Resolved trades</h2>
                <span className="text-xs text-slate-500">{trades.filter(t => t.result).length} resolved / {trades.length} total</span>
              </div>
              {trades.length === 0 ? (
                <div className="text-sm text-slate-500">No trades yet. Live paper trades appear here as each 5m candle resolves.</div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="text-slate-500 uppercase tracking-wider">
                        <th className="text-left py-1 pr-3">Entry (UTC)</th>
                        <th className="text-right py-1 pr-3">BTC @ entry</th>
                        <th className="text-right py-1 pr-3">Side</th>
                        <th className="text-right py-1 pr-3">Our q</th>
                        <th className="text-right py-1 pr-3">Fill</th>
                        <th className="text-right py-1 pr-3">Edge</th>
                        <th className="text-right py-1 pr-3">Stake</th>
                        <th className="text-right py-1 pr-3">BTC @ resolve</th>
                        <th className="text-right py-1 pr-3">Result</th>
                        <th className="text-right py-1 pr-3">Source</th>
                        <th className="text-right py-1">P/L</th>
                      </tr>
                    </thead>
                    <tbody>
                      {trades.slice().reverse().slice(0, 50).map((t, i) => {
                        const entry = t.entry_ts ? new Date(Number(t.entry_ts) * 1000).toISOString().replace('T',' ').slice(0,16) : '';
                        const resolved = !!t.result;
                        const pnl = t.pnl === '' || t.pnl === undefined ? null : Number(t.pnl);
                        const sideCls = t.side === 'UP' ? 'text-green-400' : 'text-red-400';
                        const resCls = t.result === 'WIN' ? 'text-green-400'
                                      : t.result === 'LOSS' ? 'text-red-400'
                                      : t.result === 'VOID' ? 'text-slate-400'
                                      : 'text-yellow-400';
                        const fmtC = (v) => (v === '' || v === undefined || v === null) ? '—' : (Number(v) * 100).toFixed(0) + '\u00a2';
                        return (
                          <tr key={i} className="border-t border-slate-700/50 text-slate-300">
                            <td className="py-1 pr-3 font-mono">{entry}</td>
                            <td className="py-1 pr-3 text-right">${Number(t.entry_close).toFixed(2)}</td>
                            <td className={`py-1 pr-3 text-right ${sideCls}`}>{t.side}</td>
                            <td className="py-1 pr-3 text-right">{t.confidence ? (Number(t.confidence) * 100).toFixed(1) + '%' : ''}</td>
                            <td className="py-1 pr-3 text-right">{fmtC(t.fill_price)}</td>
                            <td className="py-1 pr-3 text-right text-cyan-400">{fmtC(t.edge)}</td>
                            <td className="py-1 pr-3 text-right">${Number(t.stake).toFixed(2)}</td>
                            <td className="py-1 pr-3 text-right">{t.resolve_close !== '' && t.resolve_close !== undefined ? '$' + Number(t.resolve_close).toFixed(2) : '—'}</td>
                            <td className={`py-1 pr-3 text-right ${resCls}`}>{resolved ? t.result : 'OPEN'}</td>
                            <td className={`py-1 pr-3 text-right text-[10px] ${t.resolution_source === 'polymarket' ? 'text-green-500' : t.resolution_source === 'coindesk_fallback' ? 'text-yellow-500' : 'text-slate-500'}`}>
                              {t.resolution_source ? t.resolution_source.replace('_', ' ') : '—'}
                            </td>
                            <td className={`py-1 text-right ${pnl === null ? 'text-slate-500' : pnl > 0 ? 'text-green-400' : pnl < 0 ? 'text-red-400' : 'text-slate-400'}`}>
                              {pnl === null ? '—' : (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2)}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            <footer className="text-xs text-slate-600 mt-6">
              <span>Paper trading only. Standalone service.</span>
            </footer>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
