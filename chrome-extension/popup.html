<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #fff;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #444;
      border-radius: 24px;
      transition: 0.3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background: #4caf50;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .status {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }
    .status span {
      color: #aaa;
    }
  </style>
</head>
<body>
  <h2>Auto-Redeemer + MM Confirmer</h2>
  <div class="toggle-row">
    <span>Enabled</span>
    <label class="toggle">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="status">
    <div>Last scan: <span id="lastRun">—</span></div>
    <div>Buttons found: <span id="lastFound">—</span></div>
    <div>Refresh interval: 15 min</div>
    <hr style="border-color:#333;margin:8px 0">
    <div style="color:#f5a623;font-size:11px;margin-bottom:4px">MetaMask Confirmer</div>
    <div>Last confirm: <span id="mmLastConfirm">—</span></div>
    <div>Action: <span id="mmLastAction">—</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
